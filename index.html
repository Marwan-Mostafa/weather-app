<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="styles/style.css">
        <title>Weather App</title>
    </head>
    <body class="w-screen h-screen flex justify-center items-center bg-gray-900 text-white">
        <div class="bg-gray-800 p-8 w-96 rounded-2xl text-center">

            <h1 class="text-2xl font-bold mb-4">Weather App</h1>

            <input 
                id="searchInput" type="text" placeholder="Enter the city"
                class="w-full p-2 rounded text-black"
            >

            <button class="mt-4 bg-blue-600 px-4 py-2 rounded w-full searchBtn">Search</button>

            <div id="weatherResult" class="mt-6"></div>
        </div>
        <script src="js/api.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
